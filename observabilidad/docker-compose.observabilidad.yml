# Stack OPCIONAL de observabilidad para DAC: Prometheus + Grafana.
# Requiere el servidor DAC corriendo en el host (http://localhost:8080) con
# /actuator/prometheus expuesto (ver application.properties).
#
#   docker compose -f observabilidad/docker-compose.observabilidad.yml up -d
#   Prometheus -> http://localhost:9090
#   Grafana    -> http://localhost:3000   (usuario: admin, clave: admin)
#   Parar:  docker compose -f observabilidad/docker-compose.observabilidad.yml down
#
# Grafana arranca con Prometheus ya configurado como fuente de datos
# (observabilidad/grafana/provisioning/).
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dac_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dac_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
