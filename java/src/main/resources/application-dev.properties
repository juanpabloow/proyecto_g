# Perfil de DESARROLLO (dev): solo para correr DAC en el computador propio y
# para las pruebas automáticas. Actívalo con:
#   java/ejecutar.sh dev        (o SPRING_PROFILES_ACTIVE=dev)
#
# Trae la credencial DEMO del analista para poder evaluar el sistema sin
