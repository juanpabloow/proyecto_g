# Secretos fuera del repositorio (Módulo 7, Decisión 24).
# El usuario y la clave de la base se leen del archivo .env de la raíz del
# proyecto (ignorado por Git; plantilla en .env.example) o de variables de
# entorno. Sin ellos la aplicación no arranca: no hay clave por defecto.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:dac}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El schema ya existe via db/schema.sql — no dejar que Hibernate lo modifique
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# Los errores nunca devuelven trazas, mensajes internos ni nombres de clases
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Tamaño máximo del CSV que se puede subir (control de seguridad básico)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=20MB

# HU-03 — Fraccionamiento (Decisión 20, provisional: validar con S-1)
# Tope de cuantía en pesos y ventana de días en que se buscan los contratos.
dac.fraccionamiento.tope=100000000
dac.fraccionamiento.ventana-dias=30

# Observabilidad (Módulo 7 — RNF). Solo se exponen health, info y prometheus;
# nada que revele secretos ni datos de contratos. /actuator/prometheus da las
# métricas (latencia HTTP, pool de conexiones, memoria) que leen Prometheus y
# Grafana (ver observabilidad/). El acceso abierto es coherente con DT-03
# (sin sesión en localhost); al desplegar debe quedar detrás de autenticación.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=dac
info.app.name=DAC — Detector de Alertas de Contratación
info.app.modulo=7 (seguridad y RNF)

# Inicio de sesión del analista (S-10). Un solo usuario; la clave se toma del
# entorno. A diferencia de la clave de la base (sin valor por defecto, S-06),
# el login trae una credencial DEMO por defecto para poder evaluarlo sin
# configurar nada; DEBE cambiarse por variables de entorno antes de desplegar
# o de cargar datos reales (ligado a DT-03 y DT-14).
dac.auth.usuario=${DAC_AUTH_USER:analista}
dac.auth.clave=${DAC_AUTH_PASSWORD:dac-demo-2026}
