spring.datasource.url=jdbc:postgresql://localhost:5433/dac
spring.datasource.username=dac_user
spring.datasource.password=dac_pass

# El schema ya existe via db/schema.sql — no dejar que Hibernate lo modifique
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# Tamaño máximo del CSV que se puede subir (control de seguridad básico)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# HU-03 — Fraccionamiento (Decisión 20, provisional: validar con S-1)
# Tope de cuantía en pesos y ventana de días en que se buscan los contratos.
dac.fraccionamiento.tope=100000000
dac.fraccionamiento.ventana-dias=30
