# Secretos fuera del repositorio (Módulo 7, Decisión 24).
# El usuario y la clave de la base se leen del archivo .env de la raíz del
# proyecto (ignorado por Git; plantilla en .env.example) o de variables de
# entorno. Sin ellos la aplicación no arranca: no hay clave por defecto.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:dac}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El schema ya existe via db/schema.sql — no dejar que Hibernate lo modifique
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# Los errores nunca devuelven trazas, mensajes internos ni nombres de clases
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Tamaño máximo del CSV que se puede subir (control de seguridad básico)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=20MB

# HU-03 — Fraccionamiento (Decisión 20, provisional: validar con S-1)
# Tope de cuantía en pesos y ventana de días en que se buscan los contratos.
dac.fraccionamiento.tope=100000000
dac.fraccionamiento.ventana-dias=30
