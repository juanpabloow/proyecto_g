services:
  db:
    image: postgres:16
    container_name: dac_db
    environment:
      # Usuario y clave salen del archivo .env (copia de .env.example),
      # que Git ignora: los secretos no se versionan (Decisión 24).
      POSTGRES_DB: ${DB_NAME:-dac}
      POSTGRES_USER: ${DB_USER:?Falta DB_USER: copia .env.example como .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD: copia .env.example como .env}
    ports:
      - "5433:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/datos.sql:/docker-entrypoint-initdb.d/02_datos.sql
      - dac_data:/var/lib/postgresql/data

  # Visor web de la base de datos: http://localhost:8081
  # Servidor db · Usuario y clave: los de tu archivo .env · Base dac
  adminer:
    image: adminer:4
    container_name: dac_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula

volumes:
  dac_data:
